<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResenhaEstacionamentos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>Estacionamento Shopping </h1>
        <p>Painel de disponibilidade de vagas</p>
    </header>

    <main>

        <span id="vagas-livres"></span>

        <span id="fluxo-dia"></span>

        <span id="porcentagem"></span>

        <div id="alerta-lotado"></div>


        <svg id="estacionamento"
             viewBox="0 0 1000 700"
             xmlns="http://www.w3.org/2000/svg">

            <!-- Protoboards -->
            <rect x="375" y="0"
                  width="150" height="36"
                  class="protoboard"/>

            <text x="450" y="26"
                  class="texto-protoboard">
                Protoboard 1
            </text>

            <rect x="525" y="0"
                  width="150" height="36"
                  class="protoboard"/>

            <text x="600" y="26"
                  class="texto-protoboard">
                Protoboard 2
            </text>

            <!-- parte da central -->
            <rect x="750" y="50"
                  width="200" height="100"
                  class="shopping"/>

            <text x="850" y="105"
                  class="texto-shopping">
                CENTRAL
            </text>


            <!-- vaga1 -->
            <rect x="20" y="50"
                  width="100" height="150"
                  class="vaga"/>

            <circle id="vaga-1"
                    cx="70" cy="85"
                    r="12" class="indisponivel"/>

             <!-- Canteiro 1 -->
            <rect x="122" y="48"
                  width="111" height="154"
                  class="canteiro"/>


            <!-- vaga2 -->
            <rect x="235" y="50"

            <!-- Canteiro 2 -->
            <rect x="337" y="48"
                  width="111" height="154"
                  class="canteiro"/>


            <!-- vaga3 -->
            <rect x="450" y="50"
                  width="100" height="150"
                  class="vaga"/>

            <circle id="vaga-3"
                    cx="500" cy="85"
                    r="12" class="indisponivel"/>

             <!-- Canteiro 3 -->
            <rect x="552" y="48"
                  width="111" height="154"
                  class="canteiro"/>
                

            <!-- as parede tudo ai --> 

            <!-- BASE DE BAIXO -->
            <rect class="parede"
                x="15"
                y="508"
                width="980"
                height="5"
                fill="#151515"
            />

             <!-- BASE DE CIMA -->
            <rect class="parede"
                x="15"

                height="5"
                fill="#151515"
            />

            <!-- LADO DA ESQUERDA -->
            <rect class="parede"
                x="15"
                y="48"
                width="5"
                height="315"
                fill="#151515"
            />

             <!-- ENTRADA DE CIMA E -->
            <rect class="parede"
                x="0"
                y="366"
                width="20"
                height="5"
                fill="#151515"
            />

             <!-- ENTRADA DE BAIXO E -->
            <rect class="parede"
                x="15"
                y="495"
                width="5"
                height="10"
                fill="#151515"
            />

            <rect class="parede"
                x="0"
                y="487"
                width="20"
                height="5"
                fill="#151515"
            />

            <!-- LADO DA DIREITA -->
            <rect class="parede"
                x="990"
                y="48"
                width="5"
                height="315"
                fill="#151515"
            />

            <!-- ENTRADA DE CIMA D -->
            <rect class="parede"
                x="990"
                y="366"
                width="10"
                height="5"
                fill="#151515"
            />

             <!-- ENTRADA DE BAIXO D -->
            <rect class="parede"
                x="990"
                y="495"
                width="5"
                height="10"
                fill="#151515"
            />

             <rect class="parede"
                x="990"
                y="487"
                width="10"
                height="5"
                fill="#151515"
            />

            <!-- ESTRADA -->
            <rect class="estrada"
                x="120"
                y="420"
                width="150"
                height="20"
            />

            <rect class="estrada"
                x="300"
                y="420"
                width="150"
                height="20"
            />

            <rect class="estrada"
                x="480"
                y="420"
                width="150"
                height="20"
            />

            <rect class="estrada"
                x="660"
                y="420"
                width="150"
                height="20"
            />


            <!-- entrada -->
            <text x="860" y="450" class="entrada">
                ENTRADA
            </text>

            <!-- saida -->
            <text x="30" y="445" class="saida">
                SAÍDA

    <script src="{{ url_for('static', filename ='script.js')}}"></script>
